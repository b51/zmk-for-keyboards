# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 增加键盘的 BLE 无线电的发射功率，用解决延迟和左右通讯不佳的问题
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# 更改键盘默认显示名称
CONFIG_ZMK_KEYBOARD_NAME="Sofle_RGB"
# 用于解决 Windows 中与电池报告相关的错误
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
# 增加鼠标动作
CONFIG_ZMK_POINTING=y
# 设置全键无冲
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# oled相关配置
CONFIG_ZMK_DISPLAY=y
#CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=n
# Enable a widget to show words per minute
#CONFIG_ZMK_WIDGET_WPM_STATUS=n
#CONFIG_ZMK_WIDGET_LAYER_STATUS=n
#CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n
#Bongo cat猫猫敲键盘动画
#CONFIG_ZMK_WIDGET_BONGO_CAT=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

#休眠相关配置
# Milliseconds of inactivity before entering idle state	(10 minute)
CONFIG_ZMK_IDLE_TIMEOUT=600000
# Enable deep sleep support	
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# zmk studio相关配置 —— Studio 及所有 Studio RPC 模块只在中央半边启用，见 build.yaml。
# peripheral 没有 ZMK_STUDIO_RPC（ZMK_STUDIO 只在 central select ZMK_STUDIO_RPC），
# 因此 Studio 相关项不能放这里，否则外半边会因缺 nanopb 头文件编译失败。

#rgb相关配置
CONFIG_ZMK_RGB_UNDERGLOW=y
# WS2812 driver is selected from the devicetree compatible in Zephyr 4.1
#键盘进入空闲状态时关闭RGB
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

#旋钮配置
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y

# nice oled
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n

CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIP_MARCOS=n

CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_RAW_HID_DRIVER=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE_BONGO_CAT=n
# CONFIG_NICE_OLED_WIDGET_RAW_HID_TIME=y
# CONFIG_NICE_OLED_WIDGET_RAW_HID_VOLUME=y

CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_X=35
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_Y=0

# cormoran diagnostic modules. RPC flags live in build.yaml: ZMK_STUDIO_RPC is
# force-off on split peripherals, so only the non-RPC halves belong here.
# Watchdog records incidents on BOTH halves; the relay needs the peripheral->central
# event channel, and runtime-sensor-rotate's behavior must exist on both halves too.
CONFIG_ZMK_WATCHDOG=y
# DIAGNOSTIC BUILD ONLY (branch dbg-watchdog-off): both detectors turn a boot
# fault / hung work queue into sys_reboot(), which hides the real crash. Off so
# the panic prints on USB serial instead of looping.
CONFIG_ZMK_WATCHDOG_FATAL_DETECT=n
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=n
CONFIG_LOG=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# ZMK default is 14 B; the watchdog relay payload needs ~128 (its DESIGN.md).
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=128
