manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: Ziembski
      url-base: https://github.com/Ziembski
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # zmk-module-ble-management needs custom Studio RPC (app/include/zmk/studio/custom.h),
    # which does not exist upstream -> cormoran's v0.3 branch fork.
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+custom-studio-protocol+ble
      import: app/west.yml
    # last release built against ZMK v0.3; main is v0.4-only (renamed endpoint APIs)
    - name: zmk-module-ble-management
      remote: cormoran
      revision: zmk-v0.3.0.0
      clone-depth: 1
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    # - name: nice-view-press-start
    #   remote: Ziembski
    #   revision: main
  self:
    path: config
