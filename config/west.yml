manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    # All cormoran modules below need custom Studio RPC (app/include/zmk/studio/custom.h),
    # which does not exist upstream -> cormoran's fork, ZMK main / v0.4 line.
    - name: zmk
      remote: cormoran
      revision: main+custom-studio-protocol
      import: app/west.yml
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-feature-device-info
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-feature-watchdog
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-module-devtool
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
      clone-depth: 1
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    # - name: nice-view-press-start
    #   remote: Ziembski
    #   revision: main
  self:
    path: config
