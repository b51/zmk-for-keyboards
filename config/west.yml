manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    - name: Ziembski
      url-base: https://github.com/Ziembski
    - name: cormoran
      url-base: https://github.com/cormoran
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
    - name: zmk-module-ble-management
      remote: cormoran
      revision: main # or latest commit hash
    # Required: Custom ZMK fork with studio protocol support
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+custom-studio-protocol+ble
      import:
        file: app/west.yml
    # - name: nice-view-press-start
    #   remote: Ziembski
    #   revision: main
  self:
    path: config
